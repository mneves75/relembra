name: ci

# Every push to main and every pull request. scripts/ci.sh runs the same checks on one local
# platform and is the release gate (AGENTS.md, "Checks"); change both together.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  cli:
    # The CLI is a Bun AOT binary (`--aot --trim`). No stable Bun has those flags yet, and --aot
    # builds only for the platform it runs on, so each platform builds natively with the one
    # pinned canary in build/bun-toolchain.txt (an immutable npm package, checked by sha512). These
    # artifacts, from the push to main of the release commit, are the release's Linux and Windows
    # binaries (docs/RELEASE.md). Pin the first stable Bun with --aot when it ships.
    name: cli binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { os: macos-latest, platform: darwin-aarch64 }
          - { os: windows-latest, platform: windows-x64 }
          - { os: windows-11-arm, platform: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Bun
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/bun-toolchain.sh "$PLATFORM" "$RUNNER_TEMP/bun" >> "$GITHUB_PATH"
      - run: bun --revision
      - run: bun install --frozen-lockfile
      # The stable-Bun test jobs skip both (RELEMBRA_SKIP_BUILD_TOOLCHAIN): they run here.
      - name: This Bun has every build flag, and a changed cached binary is rebuilt
        run: bun test test/build-flags.test.ts test/build-cache.test.ts
      # Always built, never a cached binary, as scripts/ci.sh does.
      - run: bun build/cli.ts --force
      - name: Windows AOT startup, with a released control on failure
        if: runner.os == 'Windows'
        run: bun scripts/windows-cli-startup.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relembra-cli-${{ matrix.platform }}
          # The checksum too: test/cli/install.test.ts installs the binary against it.
          path: |
            bin/relembra
            bin/relembra.exe
            bin/relembra.sha256
          if-no-files-found: error
          retention-days: 30

  # Every test on stable Bun: the library, the CLI suite against the AOT binary from `cli`
  # (RELEMBRA_BINARY; with CI set, a missing binary fails the suite), and on Linux the Postgres
  # conformance suite against a Postgres 17 service, the image scripts/with-postgres.sh uses.
  bun-linux:
    name: bun (ubuntu-latest, postgres)
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: relembra-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      RELEMBRA_POSTGRES_URL: postgres://postgres:relembra-test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relembra-cli-linux-x64
          path: ${{ runner.temp }}/cli
      - run: chmod +x "$RUNNER_TEMP/cli/relembra"
      # Postgres files in series, every other file in parallel workers (scripts/test.ts).
      - run: bun run test:all
        env:
          RELEMBRA_BINARY: ${{ runner.temp }}/cli/relembra
          # Stable Bun cannot build the CLI; the cli job checks the toolchain that does.
          RELEMBRA_SKIP_BUILD_TOOLCHAIN: "1"

  bun-macos:
    # macOS runners have no service containers: the Postgres tests are skipped on purpose here
    # and run in bun-linux.
    name: bun (macos-latest)
    needs: cli
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      RELEMBRA_SKIP_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relembra-cli-darwin-aarch64
          path: ${{ runner.temp }}/cli
      - run: chmod +x "$RUNNER_TEMP/cli/relembra"
      # Postgres files in series, every other file in parallel workers (scripts/test.ts).
      - run: bun run test:all
        env:
          RELEMBRA_BINARY: ${{ runner.temp }}/cli/relembra
          # Stable Bun cannot build the CLI; the cli job checks the toolchain that does.
          RELEMBRA_SKIP_BUILD_TOOLCHAIN: "1"

  # The CLI suite and the library on the other release platforms, with the pinned Bun (it can
  # build, so nothing is skipped for the toolchain). No service containers here: the Postgres
  # tests run in bun-linux.
  bun-native:
    name: bun (${{ matrix.os }})
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, platform: linux-aarch64, binary: relembra }
          - { os: windows-latest, platform: windows-x64, binary: relembra.exe }
          - { os: windows-11-arm, platform: windows-aarch64, binary: relembra.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RELEMBRA_SKIP_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Bun
        env:
          PLATFORM: ${{ matrix.platform }}
        run: scripts/bun-toolchain.sh "$PLATFORM" "$RUNNER_TEMP/bun" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: relembra-cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/cli
      - env:
          BINARY: ${{ matrix.binary }}
        run: chmod +x "$RUNNER_TEMP/cli/$BINARY"
      - run: bun run test:all
        env:
          RELEMBRA_BINARY: ${{ runner.temp }}/cli/${{ matrix.binary }}

  eval:
    # The release gates on the synthetic set (eval/README.md, "Gate"): exit 0 only when relembra
    # passes on the SQLite and memory stores (leaks 0, scope denial 100%, hit@5 and wake
    # coverage at least 0.9, no label violation, superseded memory or failed request) and every
    # control candidate fails. A sealed set of real questions is scored locally, never here.
    name: eval (synthetic set)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run eval --out "$RUNNER_TEMP/eval"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-results
          path: ${{ runner.temp }}/eval
          if-no-files-found: warn

  node:
    name: node (${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # 24.14 is the floor in package.json engines; 26 is the newest major.
        node: ["24.14", "26"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: node --version
      - name: SQLite conformance under Node
        run: npm run test:node
      # One tarball, checked, then installed by Node and by Bun, as scripts/ci.sh does.
      - name: Pack hygiene
        run: npm run check:pack
      - name: Pack once
        run: mkdir "$RUNNER_TEMP/package" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - name: Packed tarball under Node
        run: node scripts/pack-smoke.ts --tarball "$RUNNER_TEMP"/package/*.tgz
      - name: Packed tarball under Bun
        run: bun scripts/pack-smoke.ts --tarball "$RUNNER_TEMP"/package/*.tgz

  node-windows:
    name: node (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
        node: ["24.14", "26"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: node --version
      - name: SQLite conformance and private Windows directory creation under Node
        run: npm run test:node

  pi-durable-latest:
    # Informational: the peer dependency claims exactly @earendil-works/pi-durable 1.4.0. This
    # probe runs the integration tests against `latest` so a breaking release shows up early; it
    # changes neither package.json nor the claim, and its failure does not fail the workflow.
    name: pi-durable (latest, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the latest pi-durable in this checkout only
        run: >-
          bun add --dev --exact
          @earendil-works/pi-durable@latest
          @earendil-works/pi-ai@latest
          @earendil-works/chord@latest
      - run: bun pm ls | grep '@earendil-works/'
      - run: bun test test/pi-durable.test.ts test/pi-durable-crash.test.ts test/pi-durable-takeover.test.ts

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The binary, not gitleaks-action: the action scans only the commits of the push or the
      # pull request, and this scans every commit of every fetched ref, like the pre-push gate.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .'

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: npm sbom --sbom-format cyclonedx > relembra.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: relembra.cdx.json
          if-no-files-found: error

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Findings fail the job and show as annotations; no SARIF upload, so the job needs no
      # security-events permission.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
